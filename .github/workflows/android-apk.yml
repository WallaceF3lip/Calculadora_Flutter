name: Android-apk-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Rename APK
        run: mv app-release.apk FlutterApkExport.apk
        working-directory: build/app/outputs/flutter-apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/FlutterApkExport.apk

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/app/outputs/flutter-apk/FlutterApkExport.apk
          tag: v1.0
          overwrite: true
          body: "This is first release"
